<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa bulunamadı | MUSTECH</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <style>
    @font-face{font-family:'Montserrat';font-style:italic;font-weight:100 900;font-display:swap;src:url(/assets/fonts/montserrat-latin-wght-italic.woff2) format('woff2')}
    @font-face{font-family:'Montserrat';font-style:italic;font-weight:100 900;font-display:swap;src:url(/assets/fonts/montserrat-latin-ext-wght-italic.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02FF,U+1E00-1EFF}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;
      font-family:'Montserrat',system-ui,sans-serif;font-style:italic;color:#fff;
      background:radial-gradient(800px 400px at 85% 0%,rgba(58,160,220,.3),transparent 60%),
                 radial-gradient(700px 400px at 0% 100%,rgba(140,198,63,.3),transparent 60%),#08120c}
    .logo{width:84px;height:84px;margin:0 auto 28px;border-radius:22px;display:grid;place-items:center}
    .logo img{width:68px;height:68px}
    h1{font-size:clamp(4rem,14vw,8rem);font-weight:800;line-height:1;
      background:linear-gradient(100deg,#9fd14a,#3aa0dc);-webkit-background-clip:text;background-clip:text;color:transparent}
    p{color:rgba(255,255,255,.7);margin:14px 0 32px;font-size:1.1rem}
    a.btn{display:inline-block;padding:15px 28px;border-radius:12px;font-weight:700;text-decoration:none;
      color:#03170d;background:linear-gradient(100deg,#9fd14a,#3aa0dc)}
  </style>
</head>
<body>
  <main>
    <div class="logo"><img src="/assets/img/logo.png" width="68" height="68" alt="MUSTECH"></div>
    <h1>404</h1>
    <p>Aradığınız sayfa bulunamadı ya da taşınmış olabilir.</p>
    <a class="btn" href="/">Ana sayfaya dön</a>
  </main>
</body>
</html>
