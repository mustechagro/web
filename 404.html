<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa bulunamadı | MUSTECH</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;
      font-family:'Outfit',system-ui,sans-serif;color:#fff;
      background:radial-gradient(800px 400px at 85% 0%,rgba(20,162,218,.3),transparent 60%),
                 radial-gradient(700px 400px at 0% 100%,rgba(31,157,92,.35),transparent 60%),#03170d}
    .logo{width:84px;height:84px;margin:0 auto 28px;border-radius:22px;background:#fff;display:grid;place-items:center}
    .logo img{width:68px;height:68px}
    h1{font-size:clamp(4rem,14vw,8rem);font-weight:800;line-height:1;
      background:linear-gradient(100deg,#6fe3a5,#5cc8f0);-webkit-background-clip:text;background-clip:text;color:transparent}
    p{color:rgba(255,255,255,.7);margin:14px 0 32px;font-size:1.1rem}
    a.btn{display:inline-block;padding:15px 28px;border-radius:12px;font-weight:700;text-decoration:none;
      color:#03170d;background:linear-gradient(100deg,#6fe3a5,#5cc8f0)}
  </style>
</head>
<body>
  <main>
    <div class="logo"><img src="/assets/img/logo.png" width="68" height="68" alt="MUSTECH"></div>
    <h1>404</h1>
    <p>Aradığınız sayfa bulunamadı ya da taşınmış olabilir.</p>
    <a class="btn" href="/">Ana sayfaya dön</a>
  </main>
</body>
</html>
